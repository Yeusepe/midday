# yaml-language-server: $schema=https://schema.zeabur.app/template.json
apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: Hermes
spec:
  description: Hermes Agent API server plus a guarded Hermes subscription proxy.
  icon: https://avatars.githubusercontent.com/u/1108533?s=64&v=4
  variables:
    - key: AGENT_DOMAIN
      type: DOMAIN
      name: Agent API Domain
      description: Public domain for the Hermes Agent OpenAI-compatible API.
    - key: PROXY_DOMAIN
      type: DOMAIN
      name: Proxy Domain
      description: Public domain for the guarded Hermes subscription proxy.
    - key: HERMES_API_KEY
      type: STRING
      name: Agent API Key
      description: Bearer token required by the Hermes Agent API server.
    - key: HERMES_PROXY_KEY
      type: STRING
      name: Proxy API Key
      description: Bearer token required by the public proxy guard.
    - key: HERMES_PROXY_PROVIDER
      type: STRING
      name: Proxy Provider
      description: Hermes proxy upstream provider, usually nous or xai.
  tags:
    - AI
    - Agent
    - Proxy
  readme: |
    # Hermes

    This template deploys the public `nousresearch/hermes-agent` Docker image with persistent `/opt/data` storage.

    It exposes two HTTP surfaces:

    - Agent API on `/v1`, authenticated with `HERMES_API_KEY`.
    - Subscription proxy on `/v1`, guarded by `HERMES_PROXY_KEY` before forwarding to the local Hermes proxy.

    The raw Hermes proxy is intentionally bound to `127.0.0.1` inside the container because upstream Hermes accepts any bearer token. Run provider login inside the service before using the proxy:

    ```bash
    hermes auth add nous
    ```
  services:
    - name: hermes
      icon: https://avatars.githubusercontent.com/u/1108533?s=64&v=4
      template: PREBUILT_V2
      domainKey:
        - port: agent
          variable: AGENT_DOMAIN
        - port: proxy
          variable: PROXY_DOMAIN
      spec:
        source:
          image: nousresearch/hermes-agent:latest
          command:
            - /bin/sh
            - -c
            - /opt/start-hermes.sh
        ports:
          - id: agent
            port: 8642
            type: HTTP
          - id: proxy
            port: 8080
            type: HTTP
        healthCheck:
          type: TCP
          port: proxy
        volumes:
          - id: data
            dir: /opt/data
        configs:
          - path: /opt/start-hermes.sh
            permission: 493
            envsubst: false
            template: |
              #!/bin/sh
              set -eu

              export HERMES_HOME=/opt/data
              export HOME=/opt/data
              export API_SERVER_ENABLED=true
              export API_SERVER_HOST=0.0.0.0
              export API_SERVER_PORT=8642
              export API_SERVER_MODEL_NAME="${API_SERVER_MODEL_NAME:-Hermes Agent}"

              mkdir -p /opt/data

              if [ -z "${API_SERVER_KEY:-}" ]; then
                echo "API_SERVER_KEY is required" >&2
                exit 1
              fi
              if [ -z "${HERMES_PROXY_KEY:-}" ]; then
                echo "HERMES_PROXY_KEY is required" >&2
                exit 1
              fi

              hermes gateway run &

              (
                while true; do
                  hermes proxy start \
                    --provider "${HERMES_PROXY_PROVIDER:-nous}" \
                    --host 127.0.0.1 \
                    --port 8645 || true
                  sleep 15
                done
              ) &

              python - <<'PY'
              import asyncio
              import os

              from aiohttp import ClientSession, ClientTimeout, web

              REQUIRED = os.environ["HERMES_PROXY_KEY"]
              UPSTREAM = "http://127.0.0.1:8645"

              def authorized(request):
                  value = request.headers.get("authorization", "")
                  scheme, _, token = value.partition(" ")
                  return scheme.lower() == "bearer" and token == REQUIRED

              async def health(_request):
                  return web.json_response({"status": "ok"})

              async def proxy(request):
                  if not authorized(request):
                      return web.json_response(
                          {"error": {"message": "unauthorized", "type": "unauthorized"}},
                          status=401,
                      )

                  tail = request.match_info.get("tail", "")
                  upstream_url = f"{UPSTREAM}/v1/{tail}"
                  if request.query_string:
                      upstream_url += "?" + request.query_string

                  headers = {
                      k: v
                      for k, v in request.headers.items()
                      if k.lower()
                      not in {
                          "host",
                          "content-length",
                          "connection",
                          "keep-alive",
                          "proxy-authenticate",
                          "proxy-authorization",
                          "te",
                          "trailers",
                          "transfer-encoding",
                          "upgrade",
                      }
                  }
                  body = await request.read()

                  timeout = ClientTimeout(total=None, sock_connect=15, sock_read=600)
                  try:
                      async with ClientSession(timeout=timeout) as session:
                          async with session.request(
                              request.method,
                              upstream_url,
                              headers=headers,
                              data=body or None,
                              allow_redirects=False,
                          ) as resp:
                              out_headers = {
                                  k: v
                                  for k, v in resp.headers.items()
                                  if k.lower()
                                  not in {
                                      "content-length",
                                      "content-encoding",
                                      "connection",
                                      "keep-alive",
                                      "proxy-authenticate",
                                      "proxy-authorization",
                                      "te",
                                      "trailers",
                                      "transfer-encoding",
                                      "upgrade",
                                  }
                              }
                              stream = web.StreamResponse(
                                  status=resp.status,
                                  headers=out_headers,
                              )
                              await stream.prepare(request)
                              async for chunk in resp.content.iter_chunked(65536):
                                  await stream.write(chunk)
                              await stream.write_eof()
                              return stream
                  except Exception as exc:
                      return web.json_response(
                          {
                              "error": {
                                  "message": f"Hermes proxy unavailable: {exc}",
                                  "type": "upstream_unavailable",
                              }
                          },
                          status=502,
                      )

              app = web.Application()
              app.router.add_get("/health", health)
              app.router.add_route("*", "/v1/{tail:.*}", proxy)
              web.run_app(app, host="0.0.0.0", port=8080)
              PY
        env:
          API_SERVER_KEY:
            default: ${HERMES_API_KEY}
          HERMES_PROXY_KEY:
            default: ${HERMES_PROXY_KEY}
          HERMES_PROXY_PROVIDER:
            default: ${HERMES_PROXY_PROVIDER}
          HERMES_UID:
            default: "10000"
          HERMES_GID:
            default: "10000"
